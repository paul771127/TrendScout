# 每天自動產生報表,發佈到 GitHub Pages:https://<帳號>.github.io/trendscout/
name: 每日報表

on:
  schedule:
    - cron: "17 0 * * *"   # 每天 UTC 00:17(台灣時間 08:17)
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 保留 GitHub 星數快照與翻譯快取,加速榜才能和前一天比較
      - uses: actions/cache@v4
        with:
          path: |
            out/github_snapshots.json
            out/translations.json
          key: trendscout-data-${{ github.run_id }}
          restore-keys: trendscout-data-
      - name: 產生報表
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python trendscout.py --per-geo 3
      - name: 準備網頁
        run: |
          mkdir -p _site
          cp "$(ls -t out/report-*.html | head -1)" _site/index.html
          cp "$(ls -t out/report-*.json | head -1)" _site/report.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
